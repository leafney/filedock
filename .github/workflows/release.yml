name: FileDock Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: filedock
  BUN_VERSION: 1.3.5

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - name: Validate tag and prepare metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: ${tag}. Expected format: v0.1.0"
            exit 1
          fi

          build_time="$(TZ=Asia/Shanghai date +"%Y-%m-%dT%H:%M:%S%z")"
          build_time="$(printf '%s\n' "${build_time}" | sed -E 's/([+-][0-9]{2})([0-9]{2})$/\1:\2/')"
          if [[ ! "${build_time}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+08:00$ ]]; then
            echo "::error::Invalid build time: ${build_time}. Expected Asia/Shanghai RFC 3339 time."
            exit 1
          fi

          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=FileDock ${tag}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${build_time}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Test and build frontend
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run Go tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: bun test

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Verify frontend output
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d frontend/dist ]] || ! find frontend/dist -type f -print -quit | grep -q .; then
            echo "::error::Frontend build output is missing or empty."
            exit 1
          fi

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary_ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            binary_ext: .exe
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary_ext: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary_ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: static/dist

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d static/dist ]] || ! find static/dist -type f -print -quit | grep -q .; then
            echo "::error::Embedded frontend files are missing or empty."
            exit 1
          fi

      - name: Build and package binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail

          binary="${APP_NAME}${{ matrix.binary_ext }}"
          asset="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.${{ matrix.archive }}"

          mkdir -p dist artifacts
          go build \
            -trimpath \
            -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.GitBranch=${GITHUB_REF_NAME}' -X 'main.GitCommit=${GITHUB_SHA}' -X 'main.BuildTime=${BUILD_TIME}'" \
            -o "dist/${binary}" \
            .

          if [[ ! -s "dist/${binary}" ]]; then
            echo "::error::Binary is missing or empty: dist/${binary}"
            exit 1
          fi

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && zip -q "../artifacts/${asset}" "${binary}")
            archive_entries="$(unzip -Z1 "artifacts/${asset}")"
          else
            tar -C dist -czf "artifacts/${asset}" "${binary}"
            archive_entries="$(tar -tzf "artifacts/${asset}")"
          fi

          if [[ ! -s "artifacts/${asset}" ]]; then
            echo "::error::Release archive is missing or empty: artifacts/${asset}"
            exit 1
          fi
          if [[ "${archive_entries}" != "${binary}" ]]; then
            echo "::error::Archive must contain only ${binary}; found:"
            printf '%s\n' "${archive_entries}"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          expected_assets=(
            "${APP_NAME}_${VERSION}_darwin_arm64.tar.gz"
            "${APP_NAME}_${VERSION}_windows_amd64.zip"
            "${APP_NAME}_${VERSION}_linux_amd64.tar.gz"
            "${APP_NAME}_${VERSION}_linux_arm64.tar.gz"
          )

          file_count="$(find release -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "${file_count}" != "4" ]]; then
            echo "::error::Expected exactly 4 release archives, found ${file_count}."
            find release -maxdepth 1 -type f -print | sort
            exit 1
          fi

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release/${asset}" ]]; then
              echo "::error::Expected release archive is missing or empty: ${asset}"
              exit 1
            fi
          done

          (
            cd release
            printf '%s\n' "${expected_assets[@]}" | sort | while IFS= read -r asset; do
              sha256sum "${asset}"
            done > checksums.txt
          )

          checksum_count="$(wc -l < release/checksums.txt | tr -d '[:space:]')"
          if [[ "${checksum_count}" != "4" ]]; then
            echo "::error::Expected 4 checksum entries, found ${checksum_count}."
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fq "  ${asset}" release/checksums.txt; then
              echo "::error::Checksum entry is missing: ${asset}"
              exit 1
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt

  notify:
    name: Notify release result
    runs-on: ubuntu-latest
    needs:
      - prepare
      - quality
      - build
      - release
    if: ${{ always() }}
    steps:
      - name: Notify release success
        if: ${{ needs.prepare.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success' }}
        continue-on-error: true
        uses: Crownor/bark-action@V3.0
        with:
          key: ${{ secrets.BARK_KEY }}
          title: GitHub Action for FileDock
          body: 编译成功 ${{ github.ref_name }}

      - name: Notify release failure
        if: ${{ needs.prepare.result != 'success' || needs.quality.result != 'success' || needs.build.result != 'success' || needs.release.result != 'success' }}
        continue-on-error: true
        uses: Crownor/bark-action@V3.0
        with:
          key: ${{ secrets.BARK_KEY }}
          title: GitHub Action for FileDock
          body: 编译失败 ${{ github.ref_name }}
