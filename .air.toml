root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/filedock ."
bin = "tmp/filedock"
full_bin = ""
include_ext = ["go", "toml", "html"]
exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules", "frontend/dist", "static/dist"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[screen]
clear_on_rebuild = true
